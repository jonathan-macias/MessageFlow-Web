# Frontend de MessageFlow en la Orange Pi. Lo usa deploy/deploy.sh desde
# /opt/messageflow-web (IMAGE_TAG e IMAGE_NAMESPACE vienen de /opt/messageflow-web/.env).
# Cloudflare Tunnel publica 127.0.0.1:3080 → https://messageflow.radiant0001.xyz
name: messageflow-web

services:
  web:
    image: ${IMAGE_NAMESPACE:-ghcr.io/jonathan-macias}/messageflow-web:${IMAGE_TAG:?IMAGE_TAG no definido en .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3000"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
